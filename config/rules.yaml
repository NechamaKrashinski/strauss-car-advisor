# כללי זכאות ותקציב לרכב חברה — שטראוס.
# מקור: docs/spec.md (תמצית הנחיות האתגר). ערכים מסומנים "dummy: true" הם
# נתוני placeholder בלבד — יוחלפו כשיגיעו משטראוס (קטלוג רכבים, טבלת עיסוקים,
# מחיר מסלול ברוכת ילדים). אסור להשתמש בהם כאמת עסקית אמיתית.

# סדר הקבוצות מהתקציב הנמוך לגבוה ביותר. "לא גבוהה ממנה" => עובד יכול לבחור
# רק מהקבוצה שלו או מקבוצה עם אינדקס נמוך יותר ברשימה הזו (תקציב קטן/שווה).
group_order: ["א", "ב", "ג", "ד"]

monthly_car_budget_by_group:
  א: 3500
  ב: 3700
  ג: 4500
  ד: 5200

# תקציב שלא נוצל לא הופך לכסף בשכר
unused_budget_becomes_cash: false

electric_vehicle:
  monthly_net_bonus: 250  # ₪ נטו, "החזר חשמל"
  # שיטת הגילום (gross-up) של הסכום הזה בתלוש טרם התקבלה משטראוס.
  grossed_up: false
  gross_up_method_dummy: true

kids_track:
  min_children: 4
  max_child_age: 23
  employer_share_of_gap: 0.5
  employee_share_of_gap: 0.5
  # מחיר הרכב במסלול: 4,500 או 6,000 ₪ לפי ה-PDF, אבל לא ידוע מה קובע בין
  # השניים (קבוצה? בחירת העובד?). placeholder בלבד עד לקבלת הכללים המדויקים.
  dummy: true
  available_car_costs: [4500, 6000]

# ויתור על רכב: מותר רק בעיסוקים ברשימה. התשלום החלופי ("אחזקת רכב") לא כולל
# רכיבים סוציאליים. טבלת העיסוקים האמיתית טרם התקבלה משטראוס — זו טבלת דמה.
car_waiver:
  dummy: true
  occupation_allowances:
    "נהג/ת משנה": 1200
    "איש/אשת מכירות שטח": 1500
    "עובד/ת משרד (לא זכאי לוויתור)": null  # null = לא רשאי/ת לוותר
